<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subnet Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f1923; color: #e0e6f0; min-height: 100vh; padding: 40px 16px; }
    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 6px; color: #5bc0f8; }
    .subtitle { text-align: center; color: #7a9abf; margin-bottom: 32px; font-size: 0.9rem; }
    .card { background: #1a2535; border-radius: 10px; padding: 28px; max-width: 720px; margin: 0 auto 24px; border: 1px solid #243044; }
    label { display: block; font-size: 0.85rem; color: #7a9abf; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    input { width: 100%; padding: 12px 16px; background: #0f1923; border: 1px solid #2d4060; border-radius: 6px; color: #e0e6f0; font-size: 1rem; outline: none; }
    input:focus { border-color: #5bc0f8; }
    button { margin-top: 16px; width: 100%; padding: 12px; background: #0f3460; border: none; border-radius: 6px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; letter-spacing: 1px; }
    button:hover { background: #1a5090; }
    .error { color: #ff6b6b; font-size: 0.9rem; margin-top: 8px; display: none; }
    .results { display: none; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
    .result-item { background: #0f1923; border-radius: 8px; padding: 14px 16px; border: 1px solid #243044; }
    .result-label { font-size: 0.75rem; color: #5bc0f8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .result-value { font-size: 1rem; font-weight: 600; font-family: 'Courier New', monospace; }
    .binary { grid-column: 1 / -1; word-break: break-all; font-size: 0.85rem; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 8px 18px; border-radius: 6px; border: 1px solid #2d4060; background: transparent; color: #7a9abf; cursor: pointer; font-size: 0.85rem; }
    .tab.active { background: #0f3460; color: #fff; border-color: #0f3460; }
    .vlsm-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .vlsm-row input { flex: 1; }
    .vlsm-row span { color: #7a9abf; font-size: 0.85rem; width: 80px; }
    #add-subnet { background: transparent; border: 1px dashed #2d4060; color: #7a9abf; margin-top: 0; }
    #add-subnet:hover { border-color: #5bc0f8; color: #5bc0f8; background: transparent; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.85rem; }
    th { text-align: left; padding: 10px 12px; background: #0f1923; color: #5bc0f8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
    td { padding: 10px 12px; border-bottom: 1px solid #1a2535; font-family: 'Courier New', monospace; }
    tr:hover td { background: #1a2535; }
    @media (max-width: 500px) { .result-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Subnet Calculator</h1>
  <p class="subtitle">CIDR &bull; VLSM &bull; IPv4 &bull; No dependencies</p>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('cidr')">CIDR Calculator</button>
      <button class="tab" onclick="switchTab('vlsm')">VLSM Planner</button>
      <button class="tab" onclick="switchTab('split')">Subnet Splitter</button>
    </div>

    <!-- CIDR Tab -->
    <div id="tab-cidr">
      <label for="cidr-input">Network (CIDR notation)</label>
      <input id="cidr-input" type="text" placeholder="e.g. 192.168.10.0/24" oninput="calcCIDR()">
      <p class="error" id="cidr-error">Invalid CIDR notation. Example: 10.0.0.0/16</p>
      <div class="results" id="cidr-results">
        <div class="result-grid">
          <div class="result-item"><div class="result-label">Network Address</div><div class="result-value" id="r-network"></div></div>
          <div class="result-item"><div class="result-label">Broadcast Address</div><div class="result-value" id="r-broadcast"></div></div>
          <div class="result-item"><div class="result-label">First Host</div><div class="result-value" id="r-first"></div></div>
          <div class="result-item"><div class="result-label">Last Host</div><div class="result-value" id="r-last"></div></div>
          <div class="result-item"><div class="result-label">Usable Hosts</div><div class="result-value" id="r-hosts"></div></div>
          <div class="result-item"><div class="result-label">Subnet Mask</div><div class="result-value" id="r-mask"></div></div>
          <div class="result-item"><div class="result-label">Wildcard Mask</div><div class="result-value" id="r-wildcard"></div></div>
          <div class="result-item"><div class="result-label">Prefix Length</div><div class="result-value" id="r-prefix"></div></div>
          <div class="result-item binary"><div class="result-label">Binary</div><div class="result-value" id="r-binary"></div></div>
        </div>
      </div>
    </div>

    <!-- VLSM Tab -->
    <div id="tab-vlsm" style="display:none">
      <label>Base Network</label>
      <input id="vlsm-network" type="text" placeholder="e.g. 10.0.0.0/16">
      <br><br>
      <label>Subnets (name + required hosts)</label>
      <div id="vlsm-rows">
        <div class="vlsm-row"><span>Subnet name</span><input placeholder="e.g. Sales" class="vlsm-name"><span style="width:30px;text-align:center">→</span><input placeholder="Hosts needed" class="vlsm-hosts" type="number" min="1"></div>
        <div class="vlsm-row"><span>Subnet name</span><input placeholder="e.g. Engineering" class="vlsm-name"><input placeholder="Hosts needed" class="vlsm-hosts" type="number" min="1"></div>
      </div>
      <button id="add-subnet" onclick="addVLSMRow()">+ Add Subnet</button>
      <button onclick="calcVLSM()">Calculate VLSM</button>
      <div id="vlsm-results"></div>
    </div>

    <!-- Split Tab -->
    <div id="tab-split" style="display:none">
      <label>Network to Split</label>
      <input id="split-network" type="text" placeholder="e.g. 172.16.0.0/16">
      <br><br>
      <label>Number of Equal Subnets</label>
      <input id="split-count" type="number" min="2" max="1024" placeholder="e.g. 4">
      <button onclick="calcSplit()">Split Network</button>
      <div id="split-results"></div>
    </div>
  </div>

  <script>
    function ipToInt(ip) {
      return ip.split('.').reduce((acc, oct) => (acc << 8) + parseInt(oct), 0) >>> 0;
    }
    function intToIp(n) {
      return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
    }
    function parseCIDR(cidr) {
      const [ip, prefix] = cidr.trim().split('/');
      if (!ip || prefix === undefined) return null;
      const pfx = parseInt(prefix);
      if (isNaN(pfx) || pfx < 0 || pfx > 32) return null;
      const parts = ip.split('.');
      if (parts.length !== 4 || parts.some(p => isNaN(p) || p < 0 || p > 255)) return null;
      const ipInt = ipToInt(ip);
      const mask = pfx === 0 ? 0 : (0xFFFFFFFF << (32 - pfx)) >>> 0;
      const network = (ipInt & mask) >>> 0;
      const broadcast = (network | (~mask >>> 0)) >>> 0;
      return { ip, pfx, ipInt, mask, network, broadcast };
    }
    function toBinary(ipInt) {
      return [24,16,8,0].map(s => ((ipInt >>> s) & 255).toString(2).padStart(8,'0')).join('.');
    }
    function calcCIDR() {
      const val = document.getElementById('cidr-input').value;
      const err = document.getElementById('cidr-error');
      const res = document.getElementById('cidr-results');
      const p = parseCIDR(val);
      if (!p) { err.style.display = 'block'; res.style.display = 'none'; return; }
      err.style.display = 'none'; res.style.display = 'block';
      const hosts = p.pfx >= 31 ? (p.pfx === 32 ? 1 : 2) : Math.pow(2, 32 - p.pfx) - 2;
      document.getElementById('r-network').textContent = intToIp(p.network);
      document.getElementById('r-broadcast').textContent = intToIp(p.broadcast);
      document.getElementById('r-first').textContent = p.pfx >= 31 ? intToIp(p.network) : intToIp(p.network + 1);
      document.getElementById('r-last').textContent = p.pfx >= 31 ? intToIp(p.broadcast) : intToIp(p.broadcast - 1);
      document.getElementById('r-hosts').textContent = hosts.toLocaleString();
      document.getElementById('r-mask').textContent = intToIp(p.mask);
      document.getElementById('r-wildcard').textContent = intToIp(~p.mask >>> 0);
      document.getElementById('r-prefix').textContent = '/' + p.pfx;
      document.getElementById('r-binary').textContent = toBinary(p.network) + '/' + p.pfx;
    }
    function switchTab(name) {
      ['cidr','vlsm','split'].forEach(t => {
        document.getElementById('tab-'+t).style.display = t === name ? '' : 'none';
        document.querySelectorAll('.tab')[['cidr','vlsm','split'].indexOf(t)].classList.toggle('active', t === name);
      });
    }
    function addVLSMRow() {
      const row = document.createElement('div'); row.className = 'vlsm-row';
      row.innerHTML = '<span>Subnet name</span><input placeholder="Subnet name" class="vlsm-name"><input placeholder="Hosts needed" class="vlsm-hosts" type="number" min="1">';
      document.getElementById('vlsm-rows').appendChild(row);
    }
    function calcVLSM() {
      const base = parseCIDR(document.getElementById('vlsm-network').value);
      if (!base) { alert('Invalid base network'); return; }
      const names = [...document.querySelectorAll('.vlsm-name')].map(i => i.value || 'Subnet');
      const hosts = [...document.querySelectorAll('.vlsm-hosts')].map(i => parseInt(i.value) || 0).filter(h => h > 0);
      const subnets = names.map((n, i) => ({ name: n, hosts: hosts[i] || 0 })).filter(s => s.hosts > 0);
      subnets.sort((a, b) => b.hosts - a.hosts);
      let current = base.network;
      const rows = subnets.map(s => {
        const needed = s.hosts + 2;
        let pfx = 32; while (Math.pow(2, 32 - pfx) < needed) pfx--;
        const size = Math.pow(2, 32 - pfx);
        const net = current; const bc = current + size - 1;
        current += size;
        return `<tr><td>${String(s.name).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</td><td>${intToIp(net)}/${pfx}</td><td>${intToIp(net+1)} – ${intToIp(bc-1)}</td><td>${size - 2}</td><td>${s.hosts}</td></tr>`;
      });
      document.getElementById('vlsm-results').innerHTML = `<table><thead><tr><th>Name</th><th>Network</th><th>Host Range</th><th>Usable</th><th>Required</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    }
    function calcSplit() {
      const base = parseCIDR(document.getElementById('split-network').value);
      const n = parseInt(document.getElementById('split-count').value);
      if (!base || isNaN(n) || n < 2) { alert('Invalid input'); return; }
      const bits = Math.ceil(Math.log2(n));
      const newPfx = base.pfx + bits;
      if (newPfx > 30) { alert('Too many subnets for this prefix'); return; }
      const size = Math.pow(2, 32 - newPfx);
      const rows = Array.from({length: Math.pow(2, bits)}, (_, i) => {
        const net = (base.network + i * size) >>> 0;
        const bc = (net + size - 1) >>> 0;
        return `<tr><td>${intToIp(net)}/${newPfx}</td><td>${intToIp(net+1)}</td><td>${intToIp(bc-1)}</td><td>${size - 2}</td></tr>`;
      });
      document.getElementById('split-results').innerHTML = `<table><thead><tr><th>Network</th><th>First Host</th><th>Last Host</th><th>Usable Hosts</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    }
  </script>
</body>
</html>
